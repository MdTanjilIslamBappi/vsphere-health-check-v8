[project]
name = "vhealth"
version = "0.1.0"
description = "Offline VMware vSphere support-bundle health assessment tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "vhealth contributors" }]
keywords = ["vmware", "vsphere", "esxi", "support-bundle", "health-check"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.6,<3",
  "jinja2>=3.1,<4",
  "python-docx>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/example/vmware-health-assessment"

[project.scripts]
vhealth = "vhealth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhealth"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
]
packaging = [
  "pyinstaller>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/synthetic_bundle.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
