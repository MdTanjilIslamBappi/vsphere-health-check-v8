# Default vhealth configuration. Copy this file, edit what you need, and
# pass it to `vhealth assess --config your-config.toml`. Any key you omit
# falls back to this default.

[report]
title = "VMware vSphere Health Assessment"
company_name = ""
# Path to a logo image file (PNG/JPEG) to place on the report cover page.
logo_path = ""

[extraction]
# Safety limits applied while extracting an untrusted support bundle.
max_total_uncompressed_bytes = 21474836480   # 20 GiB
max_member_uncompressed_bytes = 4294967296   # 4 GiB
max_entries = 500000
max_compression_ratio = 1000

[assessment]
# Rule IDs listed here are skipped entirely (e.g. known-noisy in your
# environment). Leave empty to run every rule in the catalogue.
disabled_rules = []
