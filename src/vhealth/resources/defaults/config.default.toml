# Default vhealth configuration. Copy this file, edit what you need, and
# pass it to `vhealth assess --config your-config.toml`. Any key you omit
# falls back to this default.

[report]
title = "VMware vSphere® Health Check Report"
company_name = ""
# Optional cover-page branding images (PNG/JPEG). All three are unset by
# default, which is how this public tool ships -- no logos, plain cover
# page. If you set them, point at absolute paths to image files kept
# OUTSIDE this repository (e.g. a sibling directory on your machine);
# never add them to version control alongside vhealth's own source.
# Images are placed at a fixed position/size (matching a specific
# customer-report convention), so pre-size/crop each one to roughly:
#   cover_background_image: ~8.6in x 7.8in (behind the cover title)
#   preparer_logo_image:    ~2.9in x 0.9in (top-left)
#   customer_logo_image:    ~0.85in x 0.8in (top-right)
cover_background_image = ""
preparer_logo_image = ""
customer_logo_image = ""

[extraction]
# Safety limits applied while extracting an untrusted support bundle.
max_total_uncompressed_bytes = 21474836480   # 20 GiB
max_member_uncompressed_bytes = 4294967296   # 4 GiB
max_entries = 500000
max_compression_ratio = 1000

[assessment]
# Rule IDs listed here are skipped entirely (e.g. known-noisy in your
# environment). Leave empty to run every rule in the catalogue.
disabled_rules = []
